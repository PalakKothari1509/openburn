version: "3.9"

services:
  backend:
    build: ./api
    container_name: openburn-api
    ports:
      - "5000:5000"
    volumes:
      - ./data:/data
      - ./openburn:/app/openburn
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    container_name: openburn-web
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
